<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Zeus Engine — Sin conexión</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0d1117;
    color: #f0f0f0;
    font-family: system-ui, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 460px;
    padding: 36px 32px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.03);
    border: 0.5px solid rgba(255, 255, 255, 0.08);
    text-align: center;
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 14px;
    background: rgba(239, 68, 68, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  h1 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  p  { font-size: 13.5px; line-height: 1.5; color: #9aa3b2; margin-bottom: 4px; }
  .status { font-size: 12px; color: #6b7280; margin-top: 18px; }
  button {
    margin-top: 20px;
    padding: 11px 22px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: #06210f;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #16a34a; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>No se pudo conectar con el servidor</h1>
    <p>Esta PC no tiene conexión a internet en este momento.</p>
    <p>Revisá el cable/wifi y esperá — la app va a reintentar sola.</p>
    <button id="retryBtn" type="button">Reintentar ahora</button>
    <div class="status" id="status">Reintentando automáticamente en <span id="countdown">8</span>s...</div>
  </div>

  <script>
    const params   = new URLSearchParams(window.location.search);
    const targetUrl = params.get("target") || "";
    const RETRY_SECONDS = 8;

    let remaining = RETRY_SECONDS;
    const countdownEl = document.getElementById("countdown");
    const statusEl     = document.getElementById("status");
    const retryBtn      = document.getElementById("retryBtn");

    function retry() {
      if (!targetUrl) return;
      statusEl.textContent = "Reintentando...";
      retryBtn.disabled = true;
      window.location.href = targetUrl;
    }

    retryBtn.addEventListener("click", retry);

    setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        retry();
        remaining = RETRY_SECONDS;
      }
      if (countdownEl) countdownEl.textContent = String(remaining);
    }, 1000);
  </script>
</body>
</html>
